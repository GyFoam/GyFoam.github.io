    <style>
        html,
        body {
            height: 100%;
            background-color: #fdfdfd;
            font-size: calc(1728vw / 1728);
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* 防止水平滚动 */
        }

        /* 添加动画关键帧 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInRight {
            from { 
                opacity: 0;
                transform: translateX(50px);
            }
            to { 
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 背景图片动画 */
        .bg-image {
            opacity: 0;
            animation: fadeIn 0.6s ease-in-out forwards;  /* 从1s改为0.6s */
        }

        /* 半透明背景动画 */
        .content-bg {
            opacity: 0;
            animation: fadeIn 0.5s ease-in-out 0.1s forwards;  /* 从0.8s改为0.5s，延迟从0.2s改为0.1s */
        }

        /* 标题动画 */
        .title-animation {
            opacity: 0;
            animation: slideInRight 0.4s ease-out 0.3s forwards;  /* 从0.7s改为0.4s，延迟从0.5s改为0.3s */
        }

        /* 描述文字动画 */
        .desc-animation {
            opacity: 0;
            animation: slideInRight 0.4s ease-out 0.4s forwards;  /* 从0.7s改为0.4s，延迟从0.7s改为0.4s */
        }

        /* 菜单项动画 */
        .menu-item {
            opacity: 0;
        }
        .menu-item:nth-child(1) {
            animation: slideInUp 0.3s ease-out 0.5s forwards;  /* 从0.5s改为0.3s，延迟从0.9s改为0.5s */
        }
        .menu-item:nth-child(2) {
            animation: slideInUp 0.3s ease-out 0.6s forwards;  /* 从0.5s改为0.3s，延迟从1s改为0.6s */
        }
        .menu-item:nth-child(3) {
            animation: slideInUp 0.3s ease-out 0.7s forwards;  /* 从0.5s改为0.3s，延迟从1.1s改为0.7s */
        }
        .menu-item:nth-child(4) {
            animation: slideInUp 0.3s ease-out 0.8s forwards;  /* 从0.5s改为0.3s，延迟从1.2s改为0.8s */
        }
        .menu-item:nth-child(5) {
            animation: slideInUp 0.3s ease-out 0.9s forwards;  /* 从0.5s改为0.3s，延迟从1.3s改为0.9s */
        }

        h1 {

            font-family: 'Raleway', sans-serif;
            color: #030303;
            font-size: 4.5rem;
            margin: 0;
        }

        h3 {
            /* 更换菜单项字体 */
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #030303;
            margin: 0;

            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .h3StylePTag {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            color: #030303;
            margin: 0;

            position: relative;
            display: inline-block;
        }

        h3::after {
            content: "";
            /* 必须设置 content 属性，否则伪元素不会显示 */
            position: absolute;
            /* 设置定位为绝对定位，相对于 h3 元素定位 */
            bottom: -3px;
            /* 距离文本底部的距离，根据需要调整 */
            left: 0;
            /* 设置伪元素的位置在文本最左边 */
            width: 100%;
            /* 设置下划线宽度为 h3 元素的宽度 */
            height: 2px;
            /* 设置下划线高度，根据需要调整 */
            background-color: #030303;
            /* 设置下划线颜色，根据需要调整 */
            transform: scaleX(0);
            /* 设置初始状态下划线宽度为 0，即不显示 */
            transition: transform 0.3s;
            /* 添加过渡效果，使下划线显示时有动画效果 */
        }

        h3:hover::after {
            transform: scaleX(1);
            /* 鼠标悬停时显示下划线，将宽度设置为 1，即与 h3 元素宽度一致 */
        }

        p {
            font-family: 'Montserrat', sans-serif;
            color: #030303;
            font-size: 1rem;
        }

        .img-container {
            height: 100%;
            display: flex;

            height: auto;
            width: auto;
        }

        .row,
        .col {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
